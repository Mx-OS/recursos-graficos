image: python:3.13-alpine

stages:
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

before_script:
  - apk update
  - apk add --no-cache build-base py3-cairosvg py3-pillow py3-lxml py3-cssselect
  - pip install --no-cache-dir cairosvg sphinx sphinx-design furo

build_assets:
  stage: build
  script:
    - make logo
    - make wallpapers
    - make manual-html
  artifacts:
    paths:
      - logo/output/
      - wallpapers/output/
      - source/_build/html/
    expire_in: 1 week
